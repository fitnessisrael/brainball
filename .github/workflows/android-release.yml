name: Android release (unsigned AAB for Google Play)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - name: Camera permission
        run: sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" /><uses-feature android:name="android.hardware.camera" android:required="false" /><application#' android/app/src/main/AndroidManifest.xml
      - run: npm run assets -- --android || true
      - run: npx cap sync android
      - name: Target Android 16 (API 36) and version code
        env:
          RUN_NO: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import re, os
          p = "android/variables.gradle"; s = open(p).read()
          s = re.sub(r"compileSdkVersion = \d+", "compileSdkVersion = 36", s)
          s = re.sub(r"targetSdkVersion = \d+", "targetSdkVersion = 36", s)
          s = re.sub(r"minSdkVersion = \d+", "minSdkVersion = 24", s)
          open(p, "w").write(s)
          p = "android/build.gradle"; s = open(p).read()
          s = re.sub(r"com\.android\.tools\.build:gradle:[\d.]+", "com.android.tools.build:gradle:8.9.1", s)
          open(p, "w").write(s)
          open("android/gradle.properties", "a").write("\nandroid.suppressUnsupportedCompileSdk=36\n")
          p = "android/app/build.gradle"; s = open(p).read()
          s = re.sub(r"versionCode \d+", "versionCode " + os.environ["RUN_NO"], s)
          s = re.sub(r'versionName "[^"]*"', 'versionName "1.0"', s)
          open(p, "w").write(s)
          PY
          grep -n "SdkVersion\|versionCode" android/variables.gradle android/app/build.gradle
      - name: Build bundle (signed later with the upload key)
        run: cd android && ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: brainball-unsigned-aab
          path: android/app/build/outputs/bundle/release/*.aab
      - name: Publish AAB as release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NO: ${{ github.run_number }}
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab brainball-unsigned.aab
          gh release create "android-$RUN_NO" brainball-unsigned.aab --title "Android build $RUN_NO (unsigned AAB)" --notes "Unsigned AAB, signed outside CI before upload to Google Play."
